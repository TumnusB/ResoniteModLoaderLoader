[config]
schemaVersion = "0.0.1"

[package]
namespace = "DevL0rd"
name = "ResoniteModLoaderLoader"
versionNumber = "0.1.0"
description = "Resonite Mod Loader Loader is a tiny BepInEx plugin that loads Resonite Mod Loader for you."
websiteUrl = "https://github.com/DevL0rd/ResoniteModLoaderLoader"
containsNsfwContent = false

[package.dependencies]
ResoniteModding-BepisLoader = "1.6.0"
ResoniteModding-BepisResoniteWrapper = "1.0.2"

[build]
icon = "./icon.png"
readme = "./README_THUNDERSTORE.md"
outdir = "./build"

[[build.copy]]
source = "./ResoniteModLoaderLoader/bin/Release/net10.0-windows10.0.26100.0/ResoniteModLoaderLoader.dll"
target = "plugins/ResoniteModLoaderLoader/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = ["mods"]
